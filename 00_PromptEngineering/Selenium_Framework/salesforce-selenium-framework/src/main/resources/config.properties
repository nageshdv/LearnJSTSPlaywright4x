# -------------------------------------------------------
#  Salesforce Login Automation — Environment Configuration
# -------------------------------------------------------

browser=edge

# Salesforce login URL
app.url=https://login.salesforce.com/?locale=in

# Valid credentials  (replace with real values before execution)
valid.username=your_email@domain.com
valid.password=YourValidPassword123

# Invalid credentials used in negative test scenarios
invalid.username=invalid_user@notexist.com
invalid.password=WrongPassword!99

# Explicit wait timeout (seconds)
explicit.wait.timeout=15
